<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --accent-warm: #ff6b35;
            --accent-cool: #4ecdc4;
            --accent-purple: #a855f7;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --gradient-warm: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            --gradient-cool: linear-gradient(135deg, #4ecdc4 0%, #44a8b3 100%);
            --gradient-mesh:
                radial-gradient(at 20% 80%, rgba(78, 205, 196, 0.15) 0%, transparent 50%),
                radial-gradient(at 80% 20%, rgba(255, 107, 53, 0.12) 0%, transparent 50%),
                radial-gradient(at 50% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
            --shadow-glow: 0 0 60px rgba(78, 205, 196, 0.15);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .background-layer {
            position: fixed;
            inset: 0;
            background: var(--gradient-mesh);
            z-index: -2;
            animation: meshFloat 20s ease-in-out infinite;
        }

        @keyframes meshFloat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
            animation: fadeSlideDown 0.8s ease-out;
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-warm);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .logo-text span {
            color: var(--text-muted);
            font-weight: 400;
        }

        .location-display {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .location-display:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-cool);
        }

        .location-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cool);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .location-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .location-name {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Main Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 1.5rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 2rem;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeSlideUp 0.8s ease-out backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .card-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .card-icon.weather { background: var(--gradient-warm); }
        .card-icon.transport { background: var(--gradient-cool); }

        /* Weather Card */
        .weather-main {
            grid-column: 1;
            grid-row: 1;
        }

        /* Transport Card */
        .transport-card {
            grid-column: 2;
            grid-row: 1;
        }

        .weather-current {
            display: flex;
            align-items: flex-start;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .weather-icon-large {
            font-size: 6rem;
            line-height: 1;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 53, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .weather-info {
            flex: 1;
        }

        .temperature {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: -0.04em;
            line-height: 1;
            background: var(--gradient-warm);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .temperature-unit {
            font-size: 2rem;
            font-weight: 400;
        }

        .weather-description {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-subtle);
        }

        .weather-detail {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }

        .weather-detail:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.02);
        }

        .detail-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-size: 1.25rem;
            font-weight: 600;
            font-family: 'Space Mono', monospace;
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* Forecast */
        .forecast-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-subtle);
        }

        .forecast-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .forecast-list {
            display: flex;
            gap: 0.75rem;
        }

        .forecast-item {
            flex: 1;
            text-align: center;
            padding: 1rem 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .forecast-item:hover {
            border-color: var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
        }

        .forecast-day {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .forecast-icon {
            font-size: 1.75rem;
            margin: 0.5rem 0;
        }

        .forecast-temp {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
        }

        .forecast-temp-high {
            color: var(--text-primary);
        }

        .forecast-temp-low {
            color: var(--text-muted);
        }

        /* Transport Cards */
        .transport-card {
            display: flex;
            flex-direction: column;
        }

        .stop-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .stop-distance {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            background: rgba(78, 205, 196, 0.15);
            color: var(--accent-cool);
            border-radius: var(--radius-sm);
        }

        .stop-name {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .departures-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex: 1;
        }

        .departure-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .departure-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-subtle);
            transform: translateX(4px);
        }

        .line-badge {
            min-width: 48px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Space Mono', monospace;
        }

        .line-badge.bus {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .line-badge.tram {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .line-badge.train {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .line-badge.other {
            background: linear-gradient(135deg, #636e72 0%, #b2bec3 100%);
        }

        .transport-type-icon {
            font-size: 1.1rem;
            margin-right: 0.5rem;
            opacity: 0.9;
        }

        .departure-info {
            flex: 1;
        }

        .departure-destination {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .departure-type {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .departure-time {
            text-align: right;
        }

        .time-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .time-value.imminent {
            color: var(--accent-warm);
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Loading States */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            gap: 1rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--accent-cool);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Error States */
        .error-container {
            text-align: center;
            padding: 2rem;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .retry-button {
            padding: 0.75rem 1.5rem;
            background: var(--gradient-cool);
            border: none;
            border-radius: var(--radius-md);
            color: var(--bg-primary);
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retry-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(78, 205, 196, 0.4);
        }

        /* Time Display */
        .current-time {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .current-time .time {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* Empty state */
        .empty-departures {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .empty-departures .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .api-note {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 1rem;
            text-align: center;
        }

        /* Globe Card */
        .globe-card {
            grid-column: 1 / -1;
            grid-row: 2;
            min-height: 400px;
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        .globe-card .card-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(10, 10, 15, 0.8) 0%, transparent 100%);
        }

        .card-icon.globe {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
        }

        #globeContainer {
            position: absolute;
            inset: 0;
            cursor: grab;
        }

        #globeContainer:active {
            cursor: grabbing;
        }

        .globe-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 5;
            background: var(--bg-card);
            transition: opacity 0.5s ease;
        }

        .globe-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .globe-info {
            position: absolute;
            bottom: 1.5rem;
            left: 2rem;
            right: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
        }

        .sun-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: var(--radius-md);
            backdrop-filter: blur(10px);
            font-size: 0.85rem;
        }

        .sun-icon {
            font-size: 1.25rem;
        }

        .location-marker-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid var(--accent-cool);
            border-radius: var(--radius-md);
            backdrop-filter: blur(10px);
            font-size: 0.85rem;
            color: var(--accent-cool);
        }

        /* Exchange Rate Card */
        .exchange-card {
            grid-column: 1;
            grid-row: 3;
        }

        .card-icon.exchange {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .exchange-rates {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .exchange-rate-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .exchange-currency {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .currency-flag {
            font-size: 1.5rem;
        }

        .currency-info {
            display: flex;
            flex-direction: column;
        }

        .currency-code {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .currency-name {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .exchange-values {
            display: flex;
            gap: 1.5rem;
        }

        .exchange-value {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .rate-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .rate-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .exchange-source {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .weather-main,
            .transport-card {
                grid-column: 1;
                grid-row: auto;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .weather-current {
                flex-direction: column;
                text-align: center;
            }

            .temperature {
                font-size: 4rem;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-list {
                flex-wrap: wrap;
            }

            .forecast-item {
                flex: 1 1 calc(33% - 0.5rem);
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="background-layer"></div>
    <div class="noise-overlay"></div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">Q</div>
                <div class="logo-text">Dashboard</div>
            </div>

            <div class="location-display" id="locationDisplay">
                <div class="location-dot"></div>
                <div class="location-text">
                    <span id="locationName" class="location-name"></span>
                    <span id="locationCountry"></span>
                </div>
            </div>

            <div class="current-time">
                <span id="currentDate"></span> · <span class="time" id="currentTime"></span>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Weather Card -->
            <section class="card weather-main" id="weatherCard">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-icon weather">☀️</div>
                        Météo actuelle
                    </div>
                </div>

                <div id="weatherContent">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Chargement de la météo...</div>
                    </div>
                </div>
            </section>

            <!-- Transport Card -->
            <section class="card transport-card" id="transportCard">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-icon transport">🚏</div>
                        Prochains Départs
                    </div>
                </div>

                <div id="transportContent">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Recherche des arrêts...</div>
                    </div>
                </div>
            </section>

            <!-- Exchange Rate Card -->
            <section class="card exchange-card" id="exchangeCard">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-icon exchange">💱</div>
                        Taux de Change CHF
                    </div>
                </div>

                <div id="exchangeContent">
                    <div class="loading-container">
                        <div class="loading-spinner"></div>
                        <div class="loading-text">Chargement des taux...</div>
                    </div>
                </div>
            </section>

            <!-- Globe Card -->
            <section class="card globe-card" id="globeCard">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-icon globe">🌍</div>
                        Votre Position
                    </div>
                </div>

                <div id="globeContainer"></div>

                <div class="globe-loading" id="globeLoading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Chargement du globe...</div>
                </div>

                <div class="globe-info">
                    <div class="sun-info">

        // Days of week
        const daysOfWeek = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

        // Helper: Create element with classes
        function createElement(tag, classes = [], textContent = '') {
            const el = document.createElement(tag);
            if (classes.length) el.classList.add(...classes);
            if (textContent) el.textContent = textContent;
            return el;
        }

        // Helper: Clear element
        function clearElement(el) {
            while (el.firstChild) {
                el.removeChild(el.firstChild);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            initGeolocation();
        });

        // Update time display
        function updateTime() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };

            document.getElementById('currentTime').textContent = now.toLocaleTimeString('fr-FR', timeOptions);
            document.getElementById('currentDate').textContent = now.toLocaleDateString('fr-FR', dateOptions);
        }

        // Geolocation
        function initGeolocation() {
            document.getElementById('locationName').textContent = 'Localisation...';

            if (!navigator.geolocation) {
                showLocationError('Géolocalisation non supportée');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    };
                    onLocationSuccess();
                },
                error => {
                    showLocationError('Position par défaut (Paris)');
                    // Use default position (Paris) for demo
                    currentPosition = { lat: 48.8566, lon: 2.3522 };
                    onLocationSuccess();
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function onLocationSuccess() {
            fetchWeather();
            fetchTransport();
            reverseGeocode();

            // Refresh data periodically
            setInterval(() => {
                fetchWeather();
                fetchTransport();
            }, CONFIG.refreshInterval);
        }

        // Reverse geocoding to get location name using Nominatim (OSM)
        async function reverseGeocode() {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${currentPosition.lat}&lon=${currentPosition.lon}&format=json&accept-language=fr`
                );
                const data = await response.json();

                if (data && data.address) {
                    const city = data.address.city || data.address.town || data.address.village || data.address.municipality || '';
                    const country = data.address.country_code ? data.address.country_code.toUpperCase() : '';
                    document.getElementById('locationName').textContent = city;
                    document.getElementById('locationCountry').textContent = country ? `, ${country}` : '';
                }
            } catch (error) {
                document.getElementById('locationName').textContent = `${currentPosition.lat.toFixed(4)}`;
                document.getElementById('locationCountry').textContent = `, ${currentPosition.lon.toFixed(4)}`;
            }
        }

        function showLocationError(message) {
            document.getElementById('locationName').textContent = message;
            document.getElementById('locationCountry').textContent = '';
        }

        // Check if it's currently day or night
        function isDaytime() {
            const hour = new Date().getHours();
            return hour >= 6 && hour < 20;
        }

        // Get weather icon and description from WMO code
        function getWeatherInfo(code) {
            const info = wmoIcons[code] || wmoIcons[0];
            return {
                icon: isDaytime() ? info.day : info.night,
                description: info.desc
            };
        }

        // Fetch weather data using Open-Meteo API (no key required)
        async function fetchWeather() {
            const container = document.getElementById('weatherContent');

            try {
                // Open-Meteo API - free, no key required
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${currentPosition.lat}&longitude=${currentPosition.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=6`
                );

                if (!response.ok) {
                    throw new Error('API Error');
                }

                const data = await response.json();

                // Store sunrise/sunset for globe badge
                if (data.daily && data.daily.sunrise && data.daily.sunset) {
                    window.sunTimes = {
                        sunrise: new Date(data.daily.sunrise[0]),
                        sunset: new Date(data.daily.sunset[0])
                    };
                }

                renderWeather(container, data);
            } catch (error) {
                console.error('Weather error:', error);
                renderWeatherError(container);
            }
        }

            weatherCurrent.appendChild(weatherInfoDiv);

            // Weather details

            const detailsData = [

                { icon: '💧', value: `${current.relative_humidity_2m}%`, label: 'Humidité' },

            container.appendChild(details);

            // Forecast section
            const forecastSection = createElement('div', ['forecast-section']);

            // Skip today (index 0), show next 5 days
            for (let i = 1; i < Math.min(6, daily.time.length); i++) {

        // Swiss Transport API (transport.opendata.ch) - free, no key required
        const SWISS_TRANSPORT_API = 'https://transport.opendata.ch/v1';

        // Fetch transport data using Swiss Transport API
        async function fetchTransport() {
            const container = document.getElementById('transportContent');

            try {
                // Find nearby stations using coordinates
                const locationsResponse = await fetch(
                    `${SWISS_TRANSPORT_API}/locations?x=${currentPosition.lat}&y=${currentPosition.lon}&type=station`
                );

                if (!locationsResponse.ok) {
                    throw new Error('Swiss Transport API Error');
                }

                const locationsData = await locationsResponse.json();

                // Filter out stations without valid ID
                const validStations = (locationsData.stations || []).filter(s => s.id !== null);

                if (validStations.length === 0) {
                    renderTransportCard(container, null, []);
                    return;
                }

                // Get the closest station with valid ID
                const closestStation = validStations[0];
                const stationDistance = calculateDistance(
                    currentPosition.lat,
                    currentPosition.lon,
                    closestStation.coordinate.x,
                    closestStation.coordinate.y
                );

                // Fetch stationboard (departures) for the closest station
                const stationboardResponse = await fetch(
                    `${SWISS_TRANSPORT_API}/stationboard?id=${encodeURIComponent(closestStation.id)}&limit=15`
                );

                if (!stationboardResponse.ok) {
                    throw new Error('Stationboard API Error');
                }

                const stationboardData = await stationboardResponse.json();

                // Parse all departures
                const allDepartures = [];

                if (stationboardData.stationboard) {
                    stationboardData.stationboard.forEach(journey => {
                        const now = new Date();
                        const depTime = new Date(journey.stop.departure);
                        const diffMs = depTime - now;
                        const diffMins = Math.max(0, Math.round(diffMs / 60000));

                        const category = (journey.category || '').toUpperCase();

                        // Determine transport type
                        let type = 'other';
                        if (['B', 'BUS', 'NFB', 'NFO', 'KB'].includes(category)) {
                            type = 'bus';
                        } else if (['T', 'TRAM', 'M', 'METRO'].includes(category)) {
                            type = 'tram';
                        } else if (['S', 'SN', 'IR', 'IC', 'ICE', 'ICN', 'EC', 'EN', 'RE', 'R', 'RB', 'PE', 'TGV'].includes(category)) {
                            type = 'train';
                        }

                        allDepartures.push({
                            line: journey.number || journey.name || '?',
                            destination: journey.to || 'Direction inconnue',
                            minutes: diffMins,
                            category: category,
                            type: type
                        });
                    });
                }

                // Create stop object
                const stop = {
                    id: closestStation.id,
                    name: closestStation.name,
                    distance: stationDistance
                };

                // Sort by departure time and show up to 8 departures
                allDepartures.sort((a, b) => a.minutes - b.minutes);
                renderTransportCard(container, stop, allDepartures.slice(0, 8));

            } catch (error) {
                console.error('Transport error:', error);
                renderTransportError(container);
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return Math.round(R * c);
        }

        // Get icon for transport type
        function getTransportIcon(type) {
            switch (type) {
                case 'bus': return '🚌';
                case 'tram': return '🚊';
                case 'train': return '🚆';
                default: return '🚏';
            }
        }

            stopInfo.appendChild(distance);
            const name = createElement('span', ['stop-name'], stop.name);
            stopInfo.appendChild(name);
            container.appendChild(stopInfo);

            if (departures.length === 0) {
                const empty = createElement('div', ['empty-departures']);
                const emptyText = createElement('p', [], 'Aucun départ prévu');
                empty.appendChild(emptyText);
                container.appendChild(empty);
                return;

            // Departures list
            const departuresList = createElement('div', ['departures-list']);
            departures.forEach(dep => {

        function createDepartureItem(departure) {
            const isImminent = departure.minutes <= 3;

            const timeLabel = createElement('div', ['time-label'], 'min');
            timeDiv.appendChild(timeLabel);
            item.appendChild(timeDiv);

            return item;
        }

        function renderTransportError(container) {

        // ============================================
        // 3D GLOBE WITH THREE.JS
        // ============================================

        let globe = null;

        // Calculate sun position based on current time
        function calculateSunPosition() {
            const now = new Date();
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const hour = now.getUTCHours() + now.getUTCMinutes() / 60;

            // Solar declination (simplified)
            const declination = -23.45 * Math.cos((360 / 365) * (dayOfYear + 10) * Math.PI / 180);

            // Hour angle - sun is at longitude where it's noon (12:00 UTC = 0° longitude)
            const sunLongitude = -((hour - 12) * 15);
            const sunLatitude = declination;

            return { lat: sunLatitude, lon: sunLongitude };
        }

        // Convert lat/lon to 3D position on sphere
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return new THREE.Vector3(x, y, z);
        }

        // Initialize 3D Globe
        function initGlobe() {
            const container = document.getElementById('globeContainer');
            const loadingEl = document.getElementById('globeLoading');

            if (!container || !THREE) return;

            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            const scene = new THREE.Scene();

            // Camera
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Texture loader with CORS
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = 'anonymous';

            // Earth textures from jsdelivr (CORS-enabled)
            const earthTexture = textureLoader.load(
                'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg',
                () => {
                    loadingEl.classList.add('hidden');
                }
            );

            // Night lights texture
            const nightTexture = textureLoader.load(
                'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg'
            );

            // Earth geometry
            const earthGeometry = new THREE.SphereGeometry(1, 64, 64);

            // Custom shader material for day/night transition
            const earthMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    dayTexture: { value: earthTexture },
                    nightTexture: { value: nightTexture },
                    sunDirection: { value: new THREE.Vector3(1, 0, 0) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vPosition;

                    void main() {
                        vUv = uv;
                        vNormal = normalize(normalMatrix * normal);
                        // Position in local/object space (before rotation)
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D dayTexture;
                    uniform sampler2D nightTexture;
                    uniform vec3 sunDirection;

                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vPosition;

                    void main() {
                        // Use object-space position as normal for sun calculation
                        // This gives us the original sphere normal before rotation
                        vec3 objectNormal = normalize(vPosition);

                        // Sun intensity based on object space position
                        float sunIntensity = dot(objectNormal, normalize(sunDirection));

                        // Smooth transition between day and night
                        float dayNightMix = smoothstep(-0.2, 0.3, sunIntensity);

                        vec4 dayColor = texture2D(dayTexture, vUv);
                        vec4 nightColor = texture2D(nightTexture, vUv);

                        // Boost night lights
                        nightColor.rgb *= 1.5;

                        // Mix day and night based on sun position
                        vec3 finalColor = mix(nightColor.rgb, dayColor.rgb, dayNightMix);

                        // Add atmospheric glow on the edge (view space)
                        vec3 viewNormal = normalize(vNormal);
                        float rim = 1.0 - max(dot(viewNormal, vec3(0.0, 0.0, 1.0)), 0.0);
                        rim = pow(rim, 3.0);
                        finalColor += vec3(0.3, 0.6, 1.0) * rim * 0.3;

                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });

            const earth = new THREE.Mesh(earthGeometry, earthMaterial);
            scene.add(earth);

            // Atmosphere glow
            const atmosphereGeometry = new THREE.SphereGeometry(1.15, 64, 64);
            const atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity * 0.5;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });
            const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphere);

            // Location marker
            let marker = null;

            function createLocationMarker(lat, lon) {
                if (marker) scene.remove(marker);

                const markerGroup = new THREE.Group();

                // Pin
                const pinGeometry = new THREE.SphereGeometry(0.03, 16, 16);
                const pinMaterial = new THREE.MeshBasicMaterial({ color: 0x4ecdc4 });
                const pin = new THREE.Mesh(pinGeometry, pinMaterial);
                markerGroup.add(pin);

                // Glow ring
                const ringGeometry = new THREE.RingGeometry(0.04, 0.07, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({
                    color: 0x4ecdc4,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                markerGroup.add(ring);

                // Position on globe
                const pos = latLonToVector3(lat, lon, 1.02);
                markerGroup.position.copy(pos);
                markerGroup.lookAt(0, 0, 0);

                scene.add(markerGroup);
                marker = markerGroup;

                return markerGroup;
            }

            // Stars background
            const starsGeometry = new THREE.BufferGeometry();
            const starPositions = [];
            for (let i = 0; i < 2000; i++) {
                const x = (Math.random() - 0.5) * 200;
                const y = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;
                starPositions.push(x, y, z);
            }
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);

            // Animation state
            let targetRotation = { x: 0, y: 0 };
            let currentRotation = { x: 0, y: 0 };
            let isAnimatingToPosition = false;
            let animationProgress = 0;
            let startCameraZ = 5;
            let targetCameraZ = 2.5;

            // Update sun position
            function updateSunPosition() {
                const sunPos = calculateSunPosition();
                const sunVec = latLonToVector3(sunPos.lat, sunPos.lon, 1);
                earthMaterial.uniforms.sunDirection.value.copy(sunVec).normalize();

                // Update UI with real sunrise/sunset times
                const sunEl = document.getElementById('sunPosition');
                const sunIcon = document.getElementById('sunIcon');
                if (sunEl) {
                    const now = new Date();
                    let isDay;
                    if (window.sunTimes) {
                        isDay = now >= window.sunTimes.sunrise && now < window.sunTimes.sunset;
                    } else {
                        // Fallback
                        const hour = now.getHours();
                        isDay = hour >= 6 && hour < 20;
                    }
                    sunEl.textContent = isDay ? 'Jour' : 'Nuit';
                    if (sunIcon) {
                        sunIcon.textContent = isDay ? '☀️' : '🌙';
                    }
                }
            }

            // Animate to user position
            function animateToPosition(lat, lon) {
                // Calculate rotation to center on position
                targetRotation.y = -lon * (Math.PI / 180) - Math.PI / 2;
                targetRotation.x = lat * (Math.PI / 180);

                isAnimatingToPosition = true;
                animationProgress = 0;

                // Create marker
                createLocationMarker(lat, lon);

                // Update coords display
                const coordsEl = document.getElementById('globeCoords');
                if (coordsEl) {
                    coordsEl.textContent = `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
                }
            }

            // Mouse interaction
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                targetRotation.y += deltaMove.x * 0.005;
                targetRotation.x += deltaMove.y * 0.005;
                targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            container.addEventListener('mouseup', () => isDragging = false);
            container.addEventListener('mouseleave', () => isDragging = false);

            // Touch support
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();

                const deltaMove = {
                    x: e.touches[0].clientX - previousMousePosition.x,
                    y: e.touches[0].clientY - previousMousePosition.y
                };

                targetRotation.y += deltaMove.x * 0.005;
                targetRotation.x += deltaMove.y * 0.005;
                targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));

                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            container.addEventListener('touchend', () => isDragging = false);

            // Mouse wheel zoom
            let targetZoom = targetCameraZ;
            const minZoom = 1.5;
            const maxZoom = 6;

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomSpeed = 0.001;
                targetZoom += e.deltaY * zoomSpeed;
                targetZoom = Math.max(minZoom, Math.min(maxZoom, targetZoom));
            }, { passive: false });

            // Double-click to reset view
            container.addEventListener('dblclick', () => {
                if (currentPosition) {
                    animateToPosition(currentPosition.lat, currentPosition.lon);
                    targetZoom = targetCameraZ;
                }
            });

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);

                // Zoom animation (initial zoom to position)
                if (isAnimatingToPosition) {
                    animationProgress += 0.015;
                    const eased = 1 - Math.pow(1 - Math.min(animationProgress, 1), 3);

                    camera.position.z = startCameraZ + (targetCameraZ - startCameraZ) * eased;
                    targetZoom = camera.position.z;

                    if (animationProgress >= 1) {
                        isAnimatingToPosition = false;
                    }
                } else {
                    // Smooth zoom with mouse wheel
                    camera.position.z += (targetZoom - camera.position.z) * 0.1;
                }

                // Smooth rotation
                currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
                currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;

                earth.rotation.x = currentRotation.x;
                earth.rotation.y = currentRotation.y;

                // Rotate marker with earth
                if (marker) {
                    marker.parent = earth;
                }

                // Update sun
                updateSunPosition();

                renderer.render(scene, camera);
            }

            // Handle resize
            function handleResize() {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
            window.addEventListener('resize', handleResize);

            animate();

            // Store globe reference
            globe = {
                animateToPosition,
                scene,
                camera,
                renderer
            };
        }

        // Initialize globe when position is available
        function initGlobeWithPosition() {
            if (currentPosition && globe) {
                globe.animateToPosition(currentPosition.lat, currentPosition.lon);
            }
        }

        // Init globe on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            // Wait a bit for container to be sized
            setTimeout(() => {
                initGlobe();
            }, 100);
        });

        // Update onLocationSuccess to also init globe
        const originalOnLocationSuccess = onLocationSuccess;
        onLocationSuccess = function() {
            originalOnLocationSuccess();
            setTimeout(initGlobeWithPosition, 500);
        };
    </script>
</body>
</html>
